spring.application.name=voicenotes

# --- Database (docker compose up -d) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5436/voicenotes}
spring.datasource.username=${DB_USER:voicenotes}
spring.datasource.password=${DB_PASSWORD:voicenotes}

# Schema is owned by Flyway; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
# Don't keep the DB session open during view rendering (hides lazy-loading / N+1 bugs).
spring.jpa.open-in-view=false
# Flip to true while studying N+1 and look at the SQL in the console.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info
