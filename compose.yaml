services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voicenotes
      POSTGRES_USER: voicenotes
      POSTGRES_PASSWORD: voicenotes
    ports:
      - "5436:5432"   # 5432-5435 on this machine are taken by other projects
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicenotes -d voicenotes"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
